{% extends 'base.html' %}

{% block content %}
    <h1>Welcome, {{ user['Name'] }}!</h1>
    <p>Address: {{ user['Address'] }}</p>
    <p>Description: {{ user['Description'] }}</p>

    {% if user.ImageURL %}
        <img src="{{ url_for( 'static', filename=user.ImageURL.split('static/')[1]) }}" alt="Restaurant Image" class="img-fluid">
    {% endif %}
{% endblock %}
