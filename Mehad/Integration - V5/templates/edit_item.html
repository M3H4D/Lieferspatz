{% extends 'base.html' %}

{% block head %}
    <title>Edit Item</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <style>
        .item-image {
            max-width: 200px;
            max-height: 200px;
            width: auto;
            height: auto;
        }
    </style>
{% endblock%}

{% block content %}
<form action="/restaurant/edit_item" method="POST" style="margin: 0;" enctype="multipart/form-data">
    <label for="Name">Name</label>
    <input type="text" name="Name" value="{{item[0][1]}}" required><br>

    <label for="Price">Price:</label>
    <input type="text" name="Price" value="{{item[0][2]}}" required><br>

    <label for="Description">Description:</label>
    <input type="text" name="Description" value="{{item[0][3]}}"required><br>

    <label for="image_url">Image:</label>
    <input type="file" name="image_url" accept="image/*" value="{{item[0][4]}}"><br>
    {% if item[0][4] %}
        <img src="{{ url_for('static', filename=item[0][5].split('static/')[1]) }}" alt="Item Image" class="item-image img-fluid">
        <p><b>Current Image:</b> {{ item[0][5].split('/')[-1] }}</p>
    {% endif %}
    
    <br>

    <button type="submit" name="ItemID" value="{{item[0][0]}}" class="btn btn-primary">Finalize Item</button>
    <a href="{{ url_for('restaurant.restaurant_dashboard') }}" class="btn btn-secondary">Cancel</a>
</form>


<!-- Modal for payment confirmation -->
<div class="modal fade" id="paymentModal" tabindex="-1" role="dialog" aria-labelledby="paymentModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="paymentModalLabel">Payment Confirmation</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <p id="paymentMessage"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="declineButton">Decline</button>
                <button type="button" class="btn btn-primary" id="acceptButton">Accept</button>
            </div>
        </div>
    </div>
</div>

<!-- Add WebSocket handling for payment notifications -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
<script>
    const socket = io();

    // Join restaurant-specific room
    socket.emit('join_room', { room: 'restaurant_{{ user["RestaurantID"] }}' });

    // Handle incoming payment notifications
    socket.on('payment_received', function (data) {
        const customerId = data.customer_id;
        const customerName = data.customer_name;
        const message = data.message;
        document.getElementById('paymentMessage').innerText = `Payment received from ${customerName}: ${message}.`;

        // Show the modal
        $('#paymentModal').modal('show');

        // Handle accept button click
        document.getElementById('acceptButton').onclick = function () {
            socket.emit('restaurant_reply', { customer_id: customerId, message: 'Payment accepted' });
            $('#paymentModal').modal('hide');
        };

        // Handle decline button click
        document.getElementById('declineButton').onclick = function () {
            socket.emit('restaurant_reply', { customer_id: customerId, message: 'Payment declined' });
            $('#paymentModal').modal('hide');
        };
    });
</script>
{% endblock%}
