{% extends "base.html" %}
{% block content %}
<h2>Register</h2>
<form method="POST">
    <input type="text" name="first_name" placeholder="First Name" class="form-control mb-2" required>
    <input type="text" name="last_name" placeholder="Last Name" class="form-control mb-2" required>
    <input type="text" name="address" placeholder="Address" class="form-control mb-2" required>
    <input type="text" name="zip_code" placeholder="Zip Code" class="form-control mb-2" required>
    <input type="text" name="phone_number" placeholder="Phone Number" class="form-control mb-2" required>
    <input type="password" name="password" placeholder="Password" class="form-control mb-2" required>
    <select name="role" class="form-select mb-2" required>
        <option value="customer">Customer</option>
        <option value="courier">Courier</option>
    </select>
    <button type="submit" class="btn btn-primary">Register</button>
</form>
{% endblock %}
